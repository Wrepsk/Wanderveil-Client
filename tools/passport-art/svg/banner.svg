<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1840" viewBox="0 0 200 460">
  <!-- Full-height nation pennant hung from the top edge of the page, swallow-notched at its foot.
       The crest and lettering are drawn live by the client (PassportDocumentView.DrawNationBanner). -->
  <defs>
    <pattern id="weave" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#FFF" fill-opacity=".07"/></pattern>
    <linearGradient id="fold" x1="0" x2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".22"/><stop offset=".18" stop-color="#000" stop-opacity="0"/>
      <stop offset=".5" stop-color="#FFF" stop-opacity=".04"/><stop offset=".82" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".22"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-5%" width="120%" height="110%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <g filter="url(#drop)"><path d="M4 0H196V456L100 410L4 456Z" fill="{{cover}}"/></g>
  <path d="M4 0H196V456L100 410L4 456Z" fill="url(#weave)"/>
  <path d="M4 0H196V456L100 410L4 456Z" fill="url(#fold)"/>
  <path d="M14 14H186V434L100 393L14 434Z" fill="none" stroke="{{foil}}" stroke-width="1.2" opacity=".85"/>
  <path d="M19 19H181V426L100 387L19 426Z" fill="none" stroke="{{foil}}" stroke-width=".5" stroke-dasharray="1.5 2.5" opacity=".6"/>
  <rect x="4" y="0" width="192" height="6" fill="{{foil}}" opacity=".9"/>
  <!-- the edition's emblem beneath the lettering (svg/emblem-<edition>.svg) -->
  <!-- include:emblem -->
</svg>
