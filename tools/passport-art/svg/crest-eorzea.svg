  <g filter="url(#emboss)" fill="none" stroke="{{foil}}">
    <circle r="56" stroke-width="2.5"/><circle r="46" stroke-width="1" stroke-dasharray="2.5 3.8"/>
    <path d="M0-51 10-10 51 0 10 10 0 51-10 10-51 0-10-10Z" stroke-width="2.5"/>
    <circle r="5" fill="{{foil}}" stroke="none"/>
