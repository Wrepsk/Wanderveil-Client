<svg xmlns="http://www.w3.org/2000/svg" width="1086" height="1448" viewBox="0 0 348 464">
  <!-- Portrait placeholder: a passport-photo window with a soft backdrop and an anonymous
       head-and-shoulders silhouette, until a real portrait is chosen. -->
  <defs>
    <clipPath id="win"><rect width="348" height="464"/></clipPath>
    <radialGradient id="backdrop" cx="50%" cy="36%" r="70%">
      <stop offset="0" stop-color="#FFF" stop-opacity=".22"/>
      <stop offset=".65" stop-color="#FFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".10"/>
    </radialGradient>
    <linearGradient id="figure" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{{ink}}" stop-opacity=".78"/>
      <stop offset="1" stop-color="{{ink}}"/>
    </linearGradient>
  </defs>
  <rect width="348" height="464" fill="{{paper}}"/>
  <rect width="348" height="464" fill="#000" fill-opacity=".06"/>
  <rect width="348" height="464" fill="url(#backdrop)"/>
  <!-- Opaque shapes under one group opacity, so where the neck overlaps the head there is no seam. -->
  <g clip-path="url(#win)" fill="url(#figure)" opacity=".42">
    <!-- head -->
    <ellipse cx="174" cy="176" rx="58" ry="66"/>
    <!-- shoulders, with a neck that widens into them in one outline -->
    <path d="M150 214C150 250 146 270 136 280C104 288 70 304 52 334C38 360 34 410 34 464H314C314 410 310 360 296 334C278 304 244 288 212 280C202 270 198 250 198 214Z"/>
  </g>
  <rect x="10" y="10" width="328" height="444" fill="none" stroke="{{ink}}" stroke-opacity=".18"/>
  <rect x="1.5" y="1.5" width="345" height="461" fill="none" stroke="{{ink}}" stroke-width="3"/>
</svg>
