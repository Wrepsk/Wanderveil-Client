openapi: 3.1.0
info:
  title: Wanderveil API
  version: 1.1.0-draft.1
  summary: Sign-in by character verification, sessions, and the holder's private passport.
  description: |
    Version 1, 21 October 2026: implemented by the Wanderveil server and this client, and used in game against a local
    server. Of the 1.1.0 additions (ADR-0005), the passport's other parts are implemented on the server; sharing,
    view requests, viewers, visits, blocks, and reports are still a draft. Compatibility promises begin with the first client release that uses it; until then it may still change.
    See README.md beside this file for the rules every endpoint follows.

    Every account is one FFXIV character verified through the Lodestone or XIVAuth. A verification proves control of
    that character's Lodestone profile at sign-in time, nothing more.

    Every request sends a `Wanderveil-Client` header with the plugin's version; a version the server no longer
    accepts answers `426` with `client_outdated`.
  license:
    name: GNU Affero General Public License 3.0 (the client repository's LICENSE.md)
servers:
  - url: https://{host}
    description: No hosted server exists yet.
    variables:
      host:
        default: api.example.invalid
security:
  - session: []
tags:
  - name: Sign-in
  - name: Session
  - name: Passport
  - name: Sharing
  - name: Visiting
  - name: Safety
paths:
  /v1/auth/lodestone/challenges:
    post:
      tags: [Sign-in]
      operationId: startLodestoneChallenge
      summary: Find a character on the Lodestone and issue a code for its profile.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CharacterRequest' }
      responses:
        '201':
          description: The code to place in the character's Lodestone profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LodestoneChallenge' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/CharacterNotFound' }
        '426': { $ref: '#/components/responses/ClientOutdated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/LodestoneUnavailable' }
  /v1/auth/lodestone/challenges/{challengeId}/verify:
    post:
      tags: [Sign-in]
      operationId: verifyLodestoneChallenge
      summary: Read the character's Lodestone profile and sign in when the code is there.
      security: []
      parameters:
        - $ref: '#/components/parameters/ChallengeId'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionGrant' }
        '404':
          description: '`challenge_not_found`: unknown, or already used; or `character_not_found`: the Lodestone no longer has the character.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '410':
          description: '`challenge_expired`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: '`code_not_found`: the profile does not show the code yet. The challenge stays valid; try again.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '426': { $ref: '#/components/responses/ClientOutdated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/LodestoneUnavailable' }
  /v1/auth/xivauth/flows:
    post:
      tags: [Sign-in]
      operationId: startXivAuthFlow
      summary: Start an XIVAuth device flow for a character.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CharacterRequest' }
      responses:
        '201':
          description: The code and page the player approves in the browser.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/XivAuthFlow' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '426': { $ref: '#/components/responses/ClientOutdated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: '`xivauth_unavailable`: XIVAuth cannot be reached, or XIVAuth sign-in is switched off.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/auth/xivauth/flows/{flowId}/poll:
    post:
      tags: [Sign-in]
      operationId: pollXivAuthFlow
      summary: Ask whether the player has approved; signs in once they have.
      description: Poll no faster than the flow's `interval`. A `429` (XIVAuth's `slow_down`) adds to it.
      security: []
      parameters:
        - $ref: '#/components/parameters/FlowId'
      responses:
        '200':
          description: Still waiting, or signed in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/XivAuthPoll' }
        '403':
          description: '`access_denied`: the player declined in XIVAuth.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: '`flow_not_found`: unknown, or already used.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '410':
          description: '`flow_expired`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: '`xivauth_character_not_verified`: the approved XIVAuth account did not share a verified character with this name and world.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '426': { $ref: '#/components/responses/ClientOutdated' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: '`xivauth_unavailable`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/session:
    get:
      tags: [Session]
      operationId: getSession
      summary: The signed-in account and when the session expires.
      responses:
        '200':
          description: The current session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '426': { $ref: '#/components/responses/ClientOutdated' }
    delete:
      tags: [Session]
      operationId: signOut
      summary: Sign out; the token stops working at once.
      responses:
        '204': { description: Signed out. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/account:
    delete:
      tags: [Session]
      operationId: deleteAccount
      summary: Delete the account, its passport record, and every session, at once.
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '426': { $ref: '#/components/responses/ClientOutdated' }
  /v1/passport:
    get:
      tags: [Passport]
      operationId: getPassport
      summary: The signed-in holder's private passport record.
      responses:
        '200':
          description: The record. `ETag` carries its revision.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PassportRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`passport_not_found`: this account has never saved one.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '426': { $ref: '#/components/responses/ClientOutdated' }
        '429': { $ref: '#/components/responses/RateLimited' }
    put:
      tags: [Passport]
      operationId: putPassport
      summary: Save the holder's passport record.
      description: |
        Needs `If-None-Match: *` for the first save, or `If-Match` with the revision last read or saved. Another save
        in between answers `412` and changes nothing; the client reads the record again and settles it. A save that
        repeats the stored document exactly succeeds without a new revision, so a retried save is harmless.
      parameters:
        - name: If-Match
          in: header
          schema: { type: string, example: '"7"' }
        - name: If-None-Match
          in: header
          schema: { type: string, const: '*' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PassportSave' }
      responses:
        '200':
          description: Saved (or already this). `ETag` carries the new revision.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PassportRecord' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '412':
          description: '`revision_conflict`: the record changed since that revision, or one exists already for `If-None-Match: *`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '413':
          description: '`document_too_large`: over 262,144 bytes.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: '`document_invalid`: not a passport document, or a version this server does not accept.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '426': { $ref: '#/components/responses/ClientOutdated' }
        '428':
          description: '`precondition_required`: neither `If-Match` nor `If-None-Match: *` was sent.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/passport/stamps:
    get:
      tags: [Passport]
      operationId: getStamps
      summary: The holder's stamps and their placements.
      description: 1.1.0 (ADR-0005); implemented on the server, not yet used by the client.
      responses:
        '200':
          description: The record. `ETag` carries its revision.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StampsRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/PartNotFound' }
        '426': { $ref: '#/components/responses/ClientOutdated' }
    put:
      tags: [Passport]
      operationId: putStamps
      summary: Save the holder's stamps, with the same revision rules as the passport.
      description: 1.1.0 (ADR-0005); implemented on the server. Needs `If-None-Match` `*` or `If-Match`, as `PUT /v1/passport`; at most 4 MiB, sent uncompressed.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfNoneMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StampsSave' }
      responses:
        '200':
          description: Saved (or already this).
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StampsRecord' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '412': { $ref: '#/components/responses/RevisionConflict' }
        '413': { $ref: '#/components/responses/DocumentTooLarge' }
        '422': { $ref: '#/components/responses/DocumentInvalid' }
        '426': { $ref: '#/components/responses/ClientOutdated' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/passport/marks:
    get:
      tags: [Passport]
      operationId: getMarks
      summary: The holder's drawing and writing on stamp pages.
      description: 1.1.0 (ADR-0005); implemented on the server. Answered gzip-compressed when the request accepts it.
      responses:
        '200':
          description: The record. `ETag` carries its revision.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarksRecord' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/PartNotFound' }
        '426': { $ref: '#/components/responses/ClientOutdated' }
    put:
      tags: [Passport]
      operationId: putMarks
      summary: Save the holder's drawing and writing, with the same revision rules as the passport.
      description: |
        1.1.0 (ADR-0005); implemented on the server. Best sent with `Content-Encoding: gzip` (no other encoding is
        accepted): at most 4 MiB as sent and 16 MiB of JSON once expanded. Needs `If-None-Match` `*` or `If-Match`, as
        `PUT /v1/passport`.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfNoneMatch'
        - name: Content-Encoding
          in: header
          schema: { type: string, const: gzip }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarksSave' }
      responses:
        '200':
          description: Saved (or already this).
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarksRecord' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '412': { $ref: '#/components/responses/RevisionConflict' }
        '413': { $ref: '#/components/responses/DocumentTooLarge' }
        '422': { $ref: '#/components/responses/DocumentInvalid' }
        '426': { $ref: '#/components/responses/ClientOutdated' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/passport/picture:
    get:
      tags: [Passport]
      operationId: getPicture
      summary: The holder's picture, as saved.
      description: 1.1.0 (ADR-0005); implemented on the server.
      responses:
        '200':
          description: The picture. `ETag` carries its revision.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/PartNotFound' }
        '426': { $ref: '#/components/responses/ClientOutdated' }
    put:
      tags: [Passport]
      operationId: putPicture
      summary: Save the holder's picture (a copy re-encoded by the client).
      description: |
        1.1.0 (ADR-0005); implemented on the server. PNG or JPEG, at most 4 MiB and 2048 px on its longer side; the
        server checks the type from the first bytes, whatever the Content-Type says. Needs `If-None-Match` `*` or
        `If-Match`; the same picture again is answered as saved without a new revision.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IfNoneMatch'
      requestBody:
        required: true
        content:
          image/png:
            schema: { type: string, format: binary }
          image/jpeg:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Saved (or already this).
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PictureInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '412': { $ref: '#/components/responses/RevisionConflict' }
        '413': { $ref: '#/components/responses/DocumentTooLarge' }
        '422':
          description: '`picture_invalid`: not a PNG or JPEG, or larger than 2048 px on its longer side.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '426': { $ref: '#/components/responses/ClientOutdated' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Passport]
      operationId: deletePicture
      summary: Remove the holder's picture.
      description: 1.1.0 (ADR-0005); implemented on the server. Needs `If-Match` with the picture's revision (or `*`).
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/PartNotFound' }
        '412': { $ref: '#/components/responses/RevisionConflict' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /v1/sharing:
    get:
      tags: [Sharing]
      operationId: getSharing
      summary: Who may open the holder's passport.
      description: Draft, 1.1.0 (ADR-0005). `approved` until changed.
      responses:
        '200':
          description: The setting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sharing' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Sharing]
      operationId: putSharing
      summary: Change who may open the holder's passport; it takes effect on the next read.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Sharing' }
      responses:
        '200':
          description: The setting, as saved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sharing' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/view-requests:
    post:
      tags: [Sharing]
      operationId: askToView
      summary: Ask a character's owner to let you view their passport.
      description: |
        Draft, 1.1.0 (ADR-0005). Always `202` for a valid name and world, whether or not the character uses Wanderveil,
        has blocked you, or already approved you: the answer never says. At most 20 a day and one pending per pair.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CharacterRequest' }
      responses:
        '202': { description: 'Asked, or quietly not where the answer must not say why.' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [Sharing]
      operationId: listViewRequests
      summary: Requests to view your passport (incoming), or the ones you sent (outgoing).
      parameters:
        - name: direction
          in: query
          required: true
          schema: { type: string, enum: [incoming, outgoing] }
      responses:
        '200':
          description: Pending requests, newest first. Outgoing ones are `pending` until approved, withdrawn, or expired; a declined one looks pending until it expires.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ViewRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/view-requests/{requestId}/approve:
    post:
      tags: [Sharing]
      operationId: approveViewRequest
      summary: Approve a request to view your passport; the sender becomes a viewer.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '204': { description: Approved. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/RequestNotFound' }
  /v1/view-requests/{requestId}/decline:
    post:
      tags: [Sharing]
      operationId: declineViewRequest
      summary: Decline a request to view your passport. The sender is not told.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '204': { description: Declined. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/RequestNotFound' }
  /v1/view-requests/{requestId}:
    delete:
      tags: [Sharing]
      operationId: withdrawViewRequest
      summary: Withdraw a request you sent.
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '204': { description: Withdrawn. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/RequestNotFound' }
  /v1/viewers:
    get:
      tags: [Sharing]
      operationId: listViewers
      summary: The players you approved to view your passport.
      responses:
        '200':
          description: Approved viewers.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Viewer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/viewers/{accountId}:
    delete:
      tags: [Sharing]
      operationId: removeViewer
      summary: Remove an approved viewer; their next read is refused.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '204': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`viewer_not_found`.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/visits:
    get:
      tags: [Visiting]
      operationId: lookUpPassport
      summary: Find a passport you may open, by character name and home world.
      parameters:
        - name: name
          in: query
          required: true
          schema: { type: string, minLength: 3, maxLength: 21 }
        - name: world
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 16 }
      responses:
        '200':
          description: The passport, its owner, and its parts' revisions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Visit' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/PassportNotVisible' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /v1/visits/{accountId}/{part}:
    get:
      tags: [Visiting]
      operationId: readVisitedPart
      summary: Read one part of a passport you may open; visibility is checked again on every read.
      description: |
        Draft, 1.1.0 (ADR-0005). `passport`, `stamps`, and `marks` answer as the owner's own record (JSON); `picture`
        answers the image. `If-None-Match` with a revision answers `304` when unchanged. Keep what you read in memory
        only.
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - name: part
          in: path
          required: true
          schema: { type: string, enum: [passport, stamps, marks, picture] }
        - name: If-None-Match
          in: header
          schema: { type: string, example: '"7"' }
      responses:
        '200': { description: The part. `ETag` carries its revision. }
        '304': { description: Unchanged since the revision named. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: '`passport_not_visible`, or `part_not_found` when the passport is visible but has no such part.'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/blocks:
    get:
      tags: [Safety]
      operationId: listBlocks
      summary: The players you blocked.
      responses:
        '200':
          description: Blocked players.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Viewer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/blocks/{accountId}:
    put:
      tags: [Safety]
      operationId: block
      summary: Block a player (from a request, a viewer, or a visited passport).
      description: Neither of you can then see or ask to see the other's passport; their approval and every pending request between you are removed.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '204': { description: Blocked (or already). }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Safety]
      operationId: unblock
      summary: Unblock a player. Approvals removed by the block do not return.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '204': { description: Unblocked (or was not blocked). }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/reports:
    post:
      tags: [Safety]
      operationId: report
      summary: Report a passport you opened. Reviewed by people; the owner is not told who reported.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Report' }
      responses:
        '202': { description: Received. }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      description: An opaque session token from a sign-in. Never logged.
  parameters:
    IfMatch:
      name: If-Match
      in: header
      schema: { type: string, example: '"7"' }
    IfNoneMatch:
      name: If-None-Match
      in: header
      schema: { type: string, const: '*' }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChallengeId:
      name: challengeId
      in: path
      required: true
      description: The secret from the challenge's creation; the code alone cannot verify.
      schema: { $ref: '#/components/schemas/Secret' }
    FlowId:
      name: flowId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Secret' }
  headers:
    ETag:
      description: The record's revision as a strong entity tag, such as `"7"`.
      schema: { type: string }
    RetryAfter:
      description: Seconds to wait before trying again.
      schema: { type: integer, minimum: 1 }
  responses:
    PartNotFound:
      description: '`part_not_found`: this account has never saved this part.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RevisionConflict:
      description: '`revision_conflict`: the part changed since that revision, or one exists already for `If-None-Match: *`.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    DocumentTooLarge:
      description: '`document_too_large`: over the part''s limit.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    DocumentInvalid:
      description: '`document_invalid`: not a document of this part, or a version this server does not accept.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionRequired:
      description: '`precondition_required`: neither `If-Match` nor `If-None-Match: *` was sent.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RequestNotFound:
      description: '`request_not_found`: no such pending request of yours.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PassportNotVisible:
      description: '`passport_not_visible`: there is no passport you may open there. The same whether the character does not use Wanderveil, has not approved you, has blocked you, or was deleted.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InvalidRequest:
      description: '`invalid_request`: a malformed body or parameter; `errors` names the fields.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: '`session_invalid`: the session expired, was signed out, or is unknown. Sign in again; never retry.'
      headers:
        WWW-Authenticate:
          schema: { type: string, example: Bearer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CharacterNotFound:
      description: '`character_not_found`: no character with exactly this name on this world on the Lodestone.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    LodestoneUnavailable:
      description: '`lodestone_unavailable`: the Lodestone did not answer, or answered in a way the server cannot read. No verdict was reached.'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: '`rate_limited`.'
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ClientOutdated:
      description: '`client_outdated`: this client version is no longer accepted; update the plugin.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    StampsDocument:
      type: object
      description: The client's local stamps file, format `wanderveil.passport-stamps`, kept as it is.
      required: [format, version]
      properties:
        format: { const: wanderveil.passport-stamps }
        version: { type: integer, minimum: 1, maximum: 2 }
      additionalProperties: true
    StampsSave:
      type: object
      required: [document]
      additionalProperties: false
      properties:
        document: { $ref: '#/components/schemas/StampsDocument' }
    StampsRecord:
      type: object
      required: [revision, updatedAt, document]
      properties:
        revision: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
        document: { $ref: '#/components/schemas/StampsDocument' }
    MarksDocument:
      type: object
      description: The client's local drawing file, format `wanderveil.passport-marks`, kept as it is.
      required: [format, version]
      properties:
        format: { const: wanderveil.passport-marks }
        version: { type: integer, minimum: 1, maximum: 1 }
      additionalProperties: true
    MarksSave:
      type: object
      required: [document]
      additionalProperties: false
      properties:
        document: { $ref: '#/components/schemas/MarksDocument' }
    MarksRecord:
      type: object
      required: [revision, updatedAt, document]
      properties:
        revision: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
        document: { $ref: '#/components/schemas/MarksDocument' }
    PictureInfo:
      type: object
      required: [revision, updatedAt, contentType, width, height, bytes]
      properties:
        revision: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
        contentType: { type: string, enum: [image/png, image/jpeg] }
        width: { type: integer, minimum: 1, maximum: 2048 }
        height: { type: integer, minimum: 1, maximum: 2048 }
        bytes: { type: integer, minimum: 1, maximum: 4194304 }
    Sharing:
      type: object
      required: [visibility]
      additionalProperties: false
      properties:
        visibility:
          type: string
          enum: [approved, anyone]
          description: '`approved`: only approved viewers (none at first). `anyone`: any signed-in player. Blocks override both.'
    PlayerView:
      type: object
      description: Another player as Wanderveil knows them, by their verified character.
      required: [accountId, character, verifiedBy]
      properties:
        accountId: { type: string, format: uuid }
        character: { $ref: '#/components/schemas/Character' }
        verifiedBy: { type: string, enum: [lodestone, xivauth] }
    ViewRequest:
      type: object
      required: [requestId, state, createdAt, expiresAt]
      properties:
        requestId: { type: string, format: uuid }
        state:
          type: string
          enum: [pending, approved]
          description: Outgoing requests become `approved` once approved; incoming ones are always `pending` (approved ones are viewers).
        from:
          description: For incoming requests, who is asking.
          allOf: [{ $ref: '#/components/schemas/PlayerView' }]
        to:
          description: For outgoing requests, the character asked for, as typed (it may not use Wanderveil).
          allOf: [{ $ref: '#/components/schemas/CharacterRequest' }]
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    Viewer:
      allOf:
        - $ref: '#/components/schemas/PlayerView'
        - type: object
          required: [since]
          properties:
            since: { type: string, format: date-time }
    Visit:
      type: object
      required: [owner, revisions]
      properties:
        owner: { $ref: '#/components/schemas/PlayerView' }
        revisions:
          type: object
          description: The revision of each part saved, absent for a part never saved.
          properties:
            passport: { type: integer }
            stamps: { type: integer }
            marks: { type: integer }
            picture: { type: integer }
    Report:
      type: object
      required: [accountId, part, reason]
      additionalProperties: false
      properties:
        accountId: { type: string, format: uuid, description: The passport's owner. }
        part: { type: string, enum: [identity, picture, marks, stamps, other] }
        reason: { type: string, enum: [harassment, hateful, sexual, spam, impersonation, other] }
        note: { type: string, maxLength: 1000 }
    Secret:
      type: string
      description: 128 random bits, base64url without padding.
      pattern: '^[A-Za-z0-9_-]{22}$'
    CharacterRequest:
      type: object
      required: [name, world]
      additionalProperties: false
      properties:
        name:
          type: string
          description: The character's full name, as the game shows it.
          minLength: 3
          maxLength: 21
          examples: ['Wander Veil']
        world:
          type: string
          description: The character's home world.
          minLength: 2
          maxLength: 16
          examples: ['Ravana']
    Character:
      type: object
      required: [lodestoneId, name, world, dataCenter]
      properties:
        lodestoneId:
          type: string
          pattern: '^[0-9]{1,12}$'
          examples: ['12345678']
        name: { type: string }
        world: { type: string }
        dataCenter: { type: string, examples: ['Materia'] }
    LodestoneChallenge:
      type: object
      required: [challengeId, code, character, expiresAt, profileUrl]
      properties:
        challengeId: { $ref: '#/components/schemas/Secret' }
        code:
          type: string
          description: Placed anywhere in the profile's self-introduction.
          pattern: '^WV-[23456789ABCDEFGHJKLMNPQRSTUVWXYZ]{8}$'
          examples: ['WV-7KQ2M9XA']
        character: { $ref: '#/components/schemas/Character' }
        expiresAt: { type: string, format: date-time }
        profileUrl:
          type: string
          format: uri
          description: Where the player edits their Lodestone profile.
    XivAuthFlow:
      type: object
      required: [flowId, userCode, verificationUri, interval, expiresAt]
      properties:
        flowId: { $ref: '#/components/schemas/Secret' }
        userCode: { type: string, description: XIVAuth's code, shown to the player. }
        verificationUri: { type: string, format: uri }
        verificationUriComplete:
          type: string
          format: uri
          description: The approval page with the code filled in, when XIVAuth gives one.
        interval: { type: integer, minimum: 1, description: Seconds between polls. }
        expiresAt: { type: string, format: date-time }
    XivAuthPoll:
      oneOf:
        - type: object
          required: [status]
          properties:
            status: { const: pending }
        - type: object
          required: [status, session]
          properties:
            status: { const: approved }
            session: { $ref: '#/components/schemas/SessionGrant' }
      discriminator:
        propertyName: status
    Account:
      type: object
      required: [accountId, character, verifiedBy, verifiedAt]
      properties:
        accountId: { type: string, format: uuid }
        character: { $ref: '#/components/schemas/Character' }
        verifiedBy:
          type: string
          enum: [lodestone, xivauth]
          description: How the latest sign-in proved control of the character's Lodestone profile.
        verifiedAt: { type: string, format: date-time }
    Session:
      type: object
      required: [account, expiresAt]
      properties:
        account: { $ref: '#/components/schemas/Account' }
        expiresAt:
          type: string
          format: date-time
          description: When the session ends if unused; each request moves it later, up to 180 days after sign-in.
    SessionGrant:
      allOf:
        - $ref: '#/components/schemas/Session'
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The bearer token. Shown once; store it protected and never log it.
              pattern: '^[A-Za-z0-9_-]{43}$'
    PassportDocument:
      type: object
      description: |
        The client's local passport file, format `wanderveil.passport`, as written by the client (see
        docs/passport-runtime.md). The server checks the format, the version, and the size, and otherwise keeps it
        as it is. It holds no picture; the picture stays local.
      required: [format, version]
      properties:
        format: { const: wanderveil.passport }
        version: { type: integer, minimum: 1, maximum: 3 }
      additionalProperties: true
    PassportSave:
      type: object
      required: [document]
      additionalProperties: false
      properties:
        document: { $ref: '#/components/schemas/PassportDocument' }
    PassportRecord:
      type: object
      required: [revision, updatedAt, document]
      properties:
        revision: { type: integer, minimum: 1 }
        updatedAt: { type: string, format: date-time }
        document: { $ref: '#/components/schemas/PassportDocument' }
    Problem:
      type: object
      description: RFC 9457 problem details with a stable `code`.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference, examples: ['about:blank'] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: Stable and machine-readable; clients branch on this, never on `title` or `detail`.
          enum:
            - invalid_request
            - session_invalid
            - client_outdated
            - rate_limited
            - character_not_found
            - lodestone_unavailable
            - challenge_not_found
            - challenge_expired
            - code_not_found
            - xivauth_unavailable
            - access_denied
            - flow_not_found
            - flow_expired
            - xivauth_character_not_verified
            - passport_not_found
            - revision_conflict
            - document_too_large
            - document_invalid
            - precondition_required
            - internal_error
            - part_not_found
            - picture_invalid
            - request_not_found
            - viewer_not_found
            - passport_not_visible
        traceId: { type: string, description: Quote this when reporting a problem. }
        errors:
          type: object
          description: For `invalid_request`, the messages for each field.
          additionalProperties:
            type: array
            items: { type: string }
