name: Wanderveil Client Build

on:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        configuration: [ Debug, Release ]

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      shell: pwsh
      run: |
        $archive = Join-Path $env:RUNNER_TEMP 'dalamud-latest.zip'
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile $archive
        Expand-Archive -Force $archive "$env:AppData\XIVLauncher\addon\Hooks\dev"

    - name: Restore locked dependencies
      run: dotnet restore Wanderveil.slnx --locked-mode

    - name: Build
      run: dotnet build Wanderveil.slnx --configuration ${{ matrix.configuration }} --no-restore

    - name: Check UI layout and input
      run: dotnet run --project tests/Wanderveil.UiChecks --configuration ${{ matrix.configuration }} -p:Platform=x64 --no-build --no-restore -- artifacts/ui/${{ matrix.configuration }}

    - name: Store UI previews
      uses: actions/upload-artifact@v4
      with:
        name: Wanderveil-UI-${{ matrix.configuration }}
        path: ./artifacts/ui/${{ matrix.configuration }}/*.bmp
        if-no-files-found: error
        retention-days: 1

    - name: Store artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Wanderveil-${{ matrix.configuration }}
        path: ./src/Wanderveil/bin/x64/${{ matrix.configuration }}/*
        if-no-files-found: error
        retention-days: 1
